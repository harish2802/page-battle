<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><title>Page Battle</title><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.ruled-pattern{background-color:#fcf9f0;background-image:linear-gradient(#dce5f2 1px,transparent 1px);background-size:100% 28px;}.notebook-red-margin{position:relative;}.notebook-red-margin::before{content:'';position:fixed;top:0;bottom:0;left:64px;width:1.5px;background-color:#e57373;z-index:20;pointer-events:none;}

/* Seamless 6.5s Cartoon Battle Timeline Keyframes */
@keyframes hero-attacker-bob {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  15% { transform: translateY(-4px) rotate(1deg); }
  25% { transform: translateY(0px) rotate(0deg); }
  28% { transform: translateY(-3px) rotate(-1deg); }
  35% { transform: translateY(0px) rotate(0deg); }
  60% { transform: translateY(-2px) rotate(0.5deg); }
}

@keyframes hero-attacker-aim {
  0%, 14% { transform: rotate(0deg); transform-origin: 215px 330px; }
  22% { transform: rotate(-14deg); transform-origin: 215px 330px; } /* Lift gun to aim */
  28% { transform: rotate(-24deg) translateX(-4px); transform-origin: 215px 330px; } /* Recoil back */
  35% { transform: rotate(-8deg); transform-origin: 215px 330px; }
  48%, 100% { transform: rotate(0deg); transform-origin: 215px 330px; } /* Lower gun back down */
}

@keyframes hero-pew-burst {
  0%, 27.8% { opacity: 0; transform: scale(0.3) translate(0, 0); }
  28% { opacity: 1; transform: scale(1.1) translate(0, -6px); }
  33% { opacity: 1; transform: scale(1.3) translate(4px, -12px); }
  38% { opacity: 0; transform: scale(0.8) translate(12px, -18px); }
  100% { opacity: 0; }
}

@keyframes hero-bullet-fly {
  0%, 28% { opacity: 0; transform: translate(300px, 310px) scale(0.6); }
  28.2% { opacity: 1; transform: translate(305px, 310px) scale(1); }
  43% { opacity: 1; transform: translate(1070px, 310px) scale(1); }
  44% { opacity: 0; transform: translate(1100px, 310px) scale(1.5); }
  100% { opacity: 0; transform: translate(1100px, 310px); }
}

@keyframes hero-bullet-trail {
  0%, 28% { opacity: 0; stroke-dashoffset: 700; }
  30% { opacity: 0.8; stroke-dashoffset: 350; }
  43% { opacity: 0.8; stroke-dashoffset: 0; }
  45%, 100% { opacity: 0; }
}

@keyframes hero-target-stagger {
  0%, 42% { transform: translateY(0px) rotate(0deg); }
  44% { transform: translate(30px, -18px) rotate(16deg); } /* Hit recoil */
  49% { transform: translate(22px, 8px) rotate(20deg); }   /* Slumping */
  55% { transform: translate(12px, 16px) rotate(15deg); }  /* Knocked dizzy */
  74% { transform: translate(6px, 8px) rotate(8deg); }    /* Shaking it off */
  82% { transform: translate(0px, -3px) rotate(-2deg); }   /* Rising back */
  90%, 100% { transform: translate(0px, 0px) rotate(0deg); } /* Back to idle */
}

@keyframes hero-target-eyes {
  0%, 42% { opacity: 0; }
  43%, 74% { opacity: 1; } /* X dizzy eyes appear during hit */
  75%, 100% { opacity: 0; }
}

@keyframes hero-target-normal-eyes {
  0%, 42% { opacity: 1; }
  43%, 74% { opacity: 0; }
  75%, 100% { opacity: 1; }
}

@keyframes hero-out-stamp-anim {
  0%, 44% { opacity: 0; transform: translate(1100px, 200px) scale(2.6) rotate(-24deg); }
  48% { opacity: 1; transform: translate(1100px, 270px) scale(1) rotate(-14deg); } /* Stamp slam */
  52% { transform: translate(1100px, 266px) scale(1.04) rotate(-13deg); }
  68% { opacity: 1; transform: translate(1100px, 270px) scale(1) rotate(-14deg); }
  76% { opacity: 0; transform: translate(1100px, 290px) scale(0.85) rotate(-10deg); }
  100% { opacity: 0; }
}

.anim-attacker { animation: hero-attacker-bob 6.5s ease-in-out infinite; }
.anim-gun-arm { animation: hero-attacker-aim 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.anim-pew { animation: hero-pew-burst 6.5s ease-out infinite; }
.anim-bullet { animation: hero-bullet-fly 6.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite; }
.anim-bullet-trail { animation: hero-bullet-trail 6.5s ease-out infinite; }
.anim-target { animation: hero-target-stagger 6.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
.anim-target-dizzy { animation: hero-target-eyes 6.5s step-end infinite; }
.anim-target-normal { animation: hero-target-normal-eyes 6.5s step-end infinite; }
.anim-stamp { animation: hero-out-stamp-anim 6.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; }

@media (prefers-reduced-motion: reduce) {
  .anim-attacker, .anim-gun-arm, .anim-pew, .anim-bullet, .anim-bullet-trail, .anim-target, .anim-target-dizzy, .anim-target-normal, .anim-stamp {
    animation: none !important;
  }
}
